name: Auditoría de código con IA local

on:
  push:
    branches:
      - feature/init_ia

jobs:
  auditoria-ia:
    runs-on: [self-hosted, Linux, X64, conferenciaIA]

    env:
      LM_STUDIO_URL: ${{ secrets.LM_STUDIO_URL }}
      LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
      LM_STUDIO_TIMEOUT: ${{ vars.LM_STUDIO_TIMEOUT }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mostrar información del entorno
        run: |
          echo "=== Runner ==="
          hostname
          echo "=== Python ==="
          python3 --version
          echo "=== Archivos modificados ==="
          git diff --name-only HEAD^ HEAD || true

      - name: Instalar dependencias
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Verificar conexión con LM Studio
        run: |
          curl --fail --silent --max-time 10 \
            "$LM_STUDIO_URL/api/v1/models" > /tmp/lmstudio-models.json
          echo "LM Studio disponible"

      - name: Ejecutar auditoría IA
        run: |
          . .venv/bin/activate
          python auditoria.py
